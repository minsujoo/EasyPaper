name: Sync upstream and release

on:
  schedule:
    # 매일 오전 4시 17분(KST)에 원본 변경을 확인한다.
    - cron: "17 19 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream-and-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream main
        id: sync
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/orion-gz/EasyPaper.git
          git fetch upstream main --tags

          before=$(git rev-parse HEAD)
          if ! git merge --no-edit upstream/main; then
            git merge --abort
            echo "::error::원본 변경과 Fork 수정이 충돌했습니다. 수동 병합이 필요합니다."
            exit 1
          fi
          after=$(git rev-parse HEAD)

          if [ "$before" != "$after" ]; then
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect unreleased app version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          latest_version=$(
            curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json" \
              | jq -r '.version // empty' 2>/dev/null || true
          )

          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$version" != "$latest_version" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "tag=v${version}-ubuntu22.04.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Start signed Ubuntu release
        if: steps.release.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run tauri-release.yml \
            --ref main \
            -f release_tag="${{ steps.release.outputs.tag }}" \
            -f publish=true

      - name: Summary
        run: |
          {
            echo "## EasyPaper Fork 동기화"
            echo "- 원본 변경 병합: ${{ steps.sync.outputs.changed }}"
            echo "- 앱 버전: ${{ steps.release.outputs.version }}"
            echo "- 새 릴리스 필요: ${{ steps.release.outputs.needed }}"
          } >> "$GITHUB_STEP_SUMMARY"
