name: Tauri Release

# 개인 Fork의 Ubuntu 22.04용 설치 파일과 Tauri updater latest.json을
# 생성한다. 원본 동기화 워크플로는 새 앱 버전을 발견했을 때 이 워크플로를
# publish=true로 호출한다.
#
# v* 태그 push 또는 publish=true 자동 호출은 빌드가 끝나면 릴리스를 즉시
# 게시한다. 그 외 수동 테스트 빌드는 실수로 공개되지 않도록 초안으로 남긴다.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "생성할 릴리스 태그"
        required: false
        type: string
      publish:
        description: "완료 후 즉시 공개"
        required: false
        default: false
        type: boolean

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # 최신 runner로 빌드하면 GLIBC 최소 버전이 올라가 Ubuntu 22.04에서
          # 실행되지 않을 수 있으므로, 지원 기준 환경에서 Linux 산출물을 만든다.
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 태그 push 시점의 "직전 태그"를 찾아 릴리스 노트를 커밋 메시지로
          # 자동 생성하려면 태그 히스토리 전체가 필요하다(기본 얕은 클론은
          # 태그를 안 가져옴).
          fetch-depth: 0

      - name: Generate release notes from commits since previous tag
        id: relnotes
        shell: bash
        run: |
          current_tag="${{ github.ref_type == 'tag' && github.ref_name || '' }}"
          prev_tag=$(git tag --list 'v*' --sort=-creatordate | grep -vFx "$current_tag" | head -n1 || true)
          range=HEAD
          if [ -n "$prev_tag" ]; then
            range="$prev_tag..HEAD"
          fi

          {
            echo "notes<<RELEASE_NOTES_EOF"
            echo "개인 Fork에서 Ubuntu 22.04 호환성 검증을 거쳐 자동 생성한 릴리스입니다."
            echo ""
            echo "## 변경 사항"
            commits=$(git log "$range" --no-merges --pretty=format:'%s' | grep -E '^(feat|fix|perf)(\(.+\))?:' || true)
            if [ -n "$commits" ]; then
              echo "$commits" | sed 's/^/- /'
            else
              echo "- 세부 변경 내역 없음"
            fi
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend deps + PyInstaller
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build sidecar binary (PyInstaller onedir, frontend dist bundled)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            backend/packaging/build.bat
          else
            backend/packaging/build.sh
          fi

      - name: Copy sidecar into src-tauri/binaries
        shell: bash
        run: src-tauri/scripts/copy-sidecar.sh

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri build deps
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install root deps (Tauri CLI)
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || format('v0.0.0-manual{0}', github.run_number) }}
          releaseName: "EasyPaper Ubuntu 22.04 ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || 'manual build' }}"
          releaseBody: ${{ steps.relnotes.outputs.notes }}
          # 자동 동기화 호출은 공개하고 일반 수동 빌드는 초안으로 남긴다.
          releaseDraft: ${{ github.ref_type != 'tag' && !inputs.publish }}
          prerelease: false
